# The review agent (agents/review.md) reads each pull request and comments on the accuracy of
# every new or changed fact. It never approves or merges: a maintainer does.
#
# Runs on pull requests from branches of this repo. For a pull request from a fork, a maintainer
# comments "/review" on it. The agent always runs with main's config and brief, reads the pull
# request only as a diff, and can't run commands or edit files (.github/opencode/review.json).
name: review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >
      (github.event_name == 'pull_request' && !github.event.pull_request.draft &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/review') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      # GitHub won't serve a diff of more than 300 files, so the diff is built with git.
      - name: Collect the pull request
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          if [ ! -f agents/review.md ] || [ ! -f .github/opencode/review.json ]; then
            echo "main has no review brief yet, so there is nothing to review with."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "since=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          base=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json baseRefName -q .baseRefName)
          git fetch -q origin "refs/pull/$PR/head:review-pr"
          mkdir -p review
          echo "$base" > review/base
          git diff --merge-base "origin/$base" review-pr > review/pr.diff
          git diff --name-status --merge-base "origin/$base" review-pr > review/files.txt
          gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json title,body -q '"# " + .title + "\n\n" + .body' > review/pr.md
          echo "$(wc -l < review/files.txt) files, $(wc -c < review/pr.diff) bytes of diff"
          echo "run=true" >> "$GITHUB_OUTPUT"
      # Every source in the changed records: does the link work, is it a made-up address, is the quote
      # on the page. main's script runs on the pull request's records (not its code).
      - name: Check every source
        if: steps.collect.outputs.run == 'true'
        run: |
          python3 -m pip install --quiet pypdf
          git worktree add -q review/pr review-pr
          python3 scripts/check_sources.py --root review/pr --base "origin/$(cat review/base)" --report review/sources.md || true
          git worktree remove --force review/pr
      - if: steps.collect.outputs.run == 'true'
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_CONFIG: .github/opencode/review.json
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GLM_BASE_URL: ${{ vars.GLM_BASE_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: gateway/${{ vars.GLM_MODEL }}
          use_github_token: true
          # Don't publish the session on opencode.ai (the default for public repos).
          share: false
          prompt: |
            Read agents/review.md and follow it exactly. The pull request's diff is review/pr.diff,
            its changed files are listed in review/files.txt (A added, M modified, D deleted,
            R renamed), its title and description are in review/pr.md, and the script check of every
            source it cites is review/sources.md. The dataset on main is in data/. Your final
            message is posted as the pull request comment exactly as you write it: start with
            "**Review agent:**", with nothing before it.
      # The review is a comment, and this check turns it into a signal: it fails when the agent found a
      # source that doesn't hold up (❌ or "Needs changes"), or posted nothing.
      - name: Fail if the review found problems
        if: steps.collect.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          SINCE: ${{ steps.collect.outputs.since }}
        run: |
          # The agent sometimes writes a line before its review, so look for the heading anywhere.
          body=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments?since=$SINCE&per_page=100" \
            --jq '[.[] | select(.body | contains("**Review agent:**"))] | last | .body // ""')
          if [ -z "$body" ]; then echo "::error::The review agent didn't post a review."; exit 1; fi
          verdict=$(printf '%s\n' "$body" | grep -m1 -F '**Review agent:**')
          echo "$verdict"
          if printf '%s' "$body" | grep -q '❌' || printf '%s' "$verdict" | grep -qi 'needs changes'; then
            echo "::error::The review agent found sources that don't hold up. See its comment on the pull request."
            exit 1
          fi
