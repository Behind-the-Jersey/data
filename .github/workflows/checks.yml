# Required on every pull request: the records match the schemas, references resolve, the rating
# rule holds, the sources in changed records are real (the link works, it isn't a made-up address,
# its quote is on the page), and the release builds. See CONTRIBUTING.md.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python3 -m pip install --quiet jsonschema pypdf
      - name: Validate records
        run: python3 scripts/validate.py
      - name: Check the sources in changed records
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_sources.py --base origin/${{ github.base_ref }}
      - name: Build the release
        run: python3 scripts/build.py
